<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>πroka — Event</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #070707; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #34d399; text-decoration: none; }
    a:hover { color: #6ee7b7; }
    :focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
  </style>
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#070707"></rect><text x="50" y="66" font-size="48" text-anchor="middle" fill="#f5f5f5" font-family="sans-serif" font-weight="700">π</text><circle cx="72" cy="30" r="5" fill="#34d399"></circle></svg></template>

<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; color: #f5f5f5; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; background: radial-gradient(70% 45% at 50% 0%, rgba(52,211,153,0.12), rgba(7,7,7,0) 70%), #070707;">
  <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 18px;">
    <a href="Piroka Homepage.dc.html" style="display: flex; align-items: center; gap: 10px; color: #f5f5f5;">
      <span style="position: relative; width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(160deg, #262626 0%, #070707 65%); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;">π<span style="position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #34d399;"></span></span>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">πroka</span>
    </a>
    <section style="position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 26px 22px; border-radius: 28px; background: linear-gradient(155deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 55%), #0c0c0c; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.5);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="flex-shrink: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 14px; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.4);"><span style="font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #34d399;">{{ ev.day }}</span><span style="font-size: 18px; font-weight: 600;">{{ ev.time }}</span></span>
        <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 12px; color: #34d399; font-weight: 600;">{{ ev.type }}</span><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance;">{{ ev.name }}</span></span>
      </div>
      <span style="font-size: 15px; color: #ccc; line-height: 1.55; text-wrap: pretty;">{{ ev.about }}</span>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04);"><span style="font-size: 11px; color: #999;">Where</span><span style="font-size: 14px; font-weight: 600;">{{ ev.venue }}</span><span style="font-size: 12px; color: #999;">{{ ev.area }}</span></div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04);"><span style="font-size: 11px; color: #999;">Going</span><span style="font-size: 22px; font-weight: 600; color: #34d399;">{{ ev.going }}</span><span style="font-size: 12px; color: #999;">Names stay private</span></div>
      </div>
      <a href="Piroka Onboarding.dc.html" style="height: 52px; border-radius: 16px; background: #34d399; color: #070707; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;">RSVP in πroka</a>
      <div style="display: flex; gap: 8px;">
        <button onClick="{{ share }}" style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #f5f5f5; font: 600 13px 'Geist', sans-serif; cursor: pointer;">{{ shareLabel }}</button>
        <a href="{{ ev.maps }}" target="_blank" style="flex: 1; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); color: #f5f5f5; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Directions</a>
      </div>
    </section>
    <span style="font-size: 12px; color: #666; line-height: 1.55; text-align: center;">18+ only. The exact guest list and anyone's location are only visible inside πroka. <a href="Piroka Help.dc.html#guidelines">Community Guidelines</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const EVENTS = {
  e0: { name: 'Drag Bingo', type: 'Community night', day: 'TONIGHT', time: '9 PM', venue: 'Club Rain', area: 'Oak Lawn, Dallas', going: 64, about: 'Queens, cards and prizes. Everyone welcome — come solo or bring friends. Proceeds go to local HIV testing.', addr: 'Cedar Springs Rd, Dallas, TX 75219' },
  e1: { name: 'Sapphic Social', type: 'Meetup', day: 'FRI', time: '8 PM', venue: 'Rooftop 9', area: 'Uptown, Dallas', going: 38, about: 'A relaxed rooftop meetup for lesbian, bi and queer women and non-binary friends.', addr: 'McKinney Ave, Dallas, TX 75204' },
  e2: { name: 'Queer Run Club', type: 'Sport', day: 'SAT', time: '8 AM', venue: 'Katy Trail', area: 'Dallas', going: 27, about: 'Five easy kilometers, all paces, coffee after.', addr: 'Katy Trail, Dallas, TX' }
};
class Component extends DCLogic {
  state = { id: 'e0', copied: false };
  route = () => { const h = (location.hash || '').slice(1); if (EVENTS[h]) this.setState({ id: h }); };
  componentDidMount() { this.route(); window.addEventListener('hashchange', this.route); }
  componentWillUnmount() { window.removeEventListener('hashchange', this.route); }
  renderVals() {
    const e = EVENTS[this.state.id];
    return {
      ev: { ...e, maps: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.venue + ' ' + e.addr) },
      shareLabel: this.state.copied ? 'Link copied ✓' : 'Share',
      share: async () => { const url = location.href; try { if (navigator.share) await navigator.share({ title: e.name + ' · πroka', url }); else { await navigator.clipboard.writeText(url); this.setState({ copied: true }); } } catch (x) {} }
    };
  }
}
</script>
</body>
</html>
